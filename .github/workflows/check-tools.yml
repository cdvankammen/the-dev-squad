name: Check duplicate tool names

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  check-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Run duplicate tool name check
        run: python3 scripts/check-duplicate-tools.py
